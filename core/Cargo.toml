[package]
name = "shotmemory-core"
version = "0.1.0"
edition = "2021"
description = "Core indexing engine for Screenshot Memory: database, scanner, hashing, metadata, thumbnails"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
dirs = "5"

[dev-dependencies]
tempfile = "3"
