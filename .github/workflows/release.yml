name: Release

# Builds installers and attaches them to a GitHub Release.
# Trigger: push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`
# Keep the tag version in sync with package.json / tauri.conf.json.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build installers and publish to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Screenshot Memory ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Local-first, offline screenshot memory. Your files are never moved, renamed, or uploaded.

            Pick your installer below: `.deb` / `.AppImage` (Linux), NSIS setup (Windows), `.dmg` (macOS).

            Notes:
            - Text extraction needs Tesseract on PATH (`tesseract-ocr` via apt, `brew install tesseract`, or the UB Mannheim installer on Windows). The app runs fine without it.
            - Linux tray icon needs `libayatana-appindicator3` at runtime (usually preinstalled on Ubuntu).
            - These builds are unsigned: on macOS right-click → Open on first launch; Windows may show a SmartScreen prompt.
