[package]
name = "screenshot-manager"
version = "0.1.0"
edition = "2021"
description = "A searchable memory for everything you screenshot. Local-first, non-destructive, cross-platform."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
shotmemory-core = { path = "../core" }
